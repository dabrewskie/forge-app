<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="robots" content="noindex, nofollow">
<title>Forge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <div id="title">Forge</div>
  <div id="subtitle"></div>
</header>
<main id="view"></main>
<div id="timer" class="hidden">
  <button id="tMinus" class="tbtn" aria-label="minus 15 seconds">−15</button>
  <div id="tDisplay">2:00</div>
  <button id="tPlus" class="tbtn" aria-label="plus 15 seconds">+15</button>
  <button id="tStop" class="tbtn" aria-label="stop timer">✕</button>
</div>
<nav id="tabs">
  <button data-tab="today" class="tab">Today</button>
  <button data-tab="program" class="tab">Program</button>
  <button data-tab="body" class="tab">Body</button>
  <button data-tab="history" class="tab">History</button>
  <button data-tab="more" class="tab">More</button>
</nav>
<div id="modal" class="hidden"><div id="sheet"></div></div>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
